name: Greptile review for Renovate majors

# Greptile never starts an automatic review on a PR opened by renovate[bot]:
# it tracks the PR but creates no review run, although .greptile/config.json and
# the dashboard both allow it. It also ignored @greptileai from
# github-actions[bot], so the mention is posted as the virtual-coffee-ci App, on
# the PRs renovate.json labels `major`.

on:
  # pull_request_target runs this file from main with no PR code checked out,
  # so a Renovate branch can't change what runs here.
  pull_request_target:
    types: [labeled, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to ask Greptile to review
        required: true
        type: number

permissions:
  contents: read

# Renovate can apply the same label twice in a second; queue the runs so the
# second sees the first one's comment.
concurrency:
  group: greptile-renovate-majors-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Ask Greptile to review
    runs-on: ubuntu-latest
    # The App token is in scope, so a manual run is pinned to main, as in
    # refresh-bot-list.yml: a branch can't borrow the token.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main') ||
      (github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      ((github.event.action == 'labeled' && github.event.label.name == 'major') ||
      (github.event.action == 'reopened' &&
      contains(github.event.pull_request.labels.*.name, 'major'))))
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          # Commenting on a PR is all it does.
          permission-pull-requests: write

      - name: Comment @greptileai
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # A manual run is a deliberate retry, so it always posts.
          RETRY: ${{ github.event_name == 'workflow_dispatch' }}
          BODY: >-
            @greptileai review this major version bump: read the release notes
            in the PR description and check this repo's usages for breaking
            changes; flag code that must change, not the bump itself.
        run: |
          if [ "$RETRY" != true ]; then
            asked=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
              --jq '[.[] | select(.user.login == "virtual-coffee-ci[bot]" and (.body | startswith("@greptileai")))] | length' \
              | awk '{ n += $1 } END { print n + 0 }')
            if [ "$asked" -gt 0 ]; then
              echo "Already asked on #$PR; not asking again."
              exit 0
            fi
          fi
          gh pr comment "$PR" --body "$BODY"
