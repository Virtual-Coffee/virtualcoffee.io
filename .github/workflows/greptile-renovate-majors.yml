name: Greptile review for Renovate majors

# Greptile never starts an automatic review on a PR opened by renovate[bot],
# and it ignores @greptileai from bot accounts (github-actions[bot] and the
# virtual-coffee-ci App both tried). Its API does start one, so on the PRs
# renovate.json labels `major` this calls trigger_code_review over Greptile's
# MCP endpoint. What a major-bump review looks for is in .greptile/config.json.

on:
  # pull_request_target runs this file from main with no PR code checked out,
  # so a Renovate branch can't change what runs here.
  pull_request_target:
    types: [labeled, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to ask Greptile to review
        required: true
        type: number

permissions:
  contents: read

# Renovate can apply the same label twice in a second; queue the runs so the
# second sees the review the first one started.
concurrency:
  group: greptile-renovate-majors-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Ask Greptile to review
    runs-on: ubuntu-latest
    # The Greptile key is in scope, so a manual run is pinned to main, as in
    # refresh-bot-list.yml: a branch can't borrow it.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref ==
      'refs/heads/main') ||
      (github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review') &&
      ((github.event.action == 'labeled' && github.event.label.name == 'major') ||
      (github.event.action == 'reopened' &&
      contains(github.event.pull_request.labels.*.name, 'major'))))
    steps:
      - name: Trigger Greptile review
        env:
          GREPTILE_API_KEY: ${{ secrets.GREPTILE_API_KEY }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          # Empty on a manual run, which is a deliberate retry and always
          # triggers.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GREPTILE_API_KEY" ]; then
            echo "::error::The GREPTILE_API_KEY secret is not set."
            exit 1
          fi

          # One MCP tools/call. Prints the tool's result text (JSON); fails on
          # a transport, JSON-RPC or tool error.
          call() {
            local response
            response=$(curl -sS --fail-with-body https://api.greptile.com/mcp \
              -H "Authorization: Bearer $GREPTILE_API_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d "$(jq -cn --arg tool "$1" --argjson args "$2" \
                '{jsonrpc: "2.0", id: 1, method: "tools/call", params: {name: $tool, arguments: $args}}')")
            # A streamed reply wraps the JSON-RPC message in `data:` lines.
            if [ "${response#event:}" != "$response" ] || [ "${response#data:}" != "$response" ]; then
              response=$(printf '%s\n' "$response" | sed -n 's/^data: //p' | tail -n 1)
            fi
            if ! jq -e '.result and (.result.isError | not)' <<<"$response" >/dev/null; then
              echo "::error::Greptile $1 failed: $response"
              return 1
            fi
            jq -r '.result.content[0].text' <<<"$response"
          }

          repo=$(jq -cn --argjson pr "$PR" \
            '{name: "virtual-coffee/virtualcoffee.io", remote: "github", defaultBranch: "main", prNumber: $pr}')

          if [ -n "$HEAD_SHA" ]; then
            started=$(call list_code_reviews "$repo" | jq --arg sha "$HEAD_SHA" \
              '[.codeReviews[] | select(.commitSha == $sha and .status != "FAILED")] | length')
            if [ "$started" -gt 0 ]; then
              echo "Greptile already has a review of $HEAD_SHA on #$PR; not asking again."
              exit 0
            fi
          fi

          call trigger_code_review "$repo"
