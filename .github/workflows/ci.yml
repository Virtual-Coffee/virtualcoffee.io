name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced from a step-level `if:`, so the whole
      # "may we push a fix?" decision is resolved once, here.
      # Fork PRs get no secrets at all, so the client id is empty and they fall
      # through to check-only automatically.
      # Bot branches are excluded because Renovate stops rebasing a branch as
      # soon as a commit from another author lands on it.
      CAN_AUTOFIX:
        ${{ secrets.CI_APP_CLIENT_ID != '' && github.event.pull_request.head.repo.full_name
        == github.repository && !contains(fromJSON('["renovate[bot]",
        "dependabot[bot]"]'), github.actor) }}
    steps:
      - name: Generate app token
        id: app-token
        if: env.CAN_AUTOFIX == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated in favour of `client-id`.
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        id: check
        run: |
          # Written outside the workspace: anything left in it would be swept
          # up by the auto-commit below.
          if pnpm exec prettier --check --ignore-unknown . > "$RUNNER_TEMP/prettier-output.txt" 2>&1; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/prettier-output.txt"

      - name: Apply formatting
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX == 'true'
        run: pnpm exec prettier --write --ignore-unknown .

      # Committed through the GraphQL API rather than the git CLI, because
      # GitHub signs API-created commits: they show as Verified and are
      # attributed to the app instead of inheriting the last human committer.
      # expectedHeadOid also makes a concurrent push fail cleanly rather than
      # racing. Untrusted values (the branch name) go through env, never
      # interpolated into the shell.
      - name: Commit formatting
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Prettier only ever rewrites files that already exist, so additions
          # cover every change it can make: no deletions, no binaries.
          additions=$(git diff --name-only -z | while IFS= read -r -d '' f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 -- "$f")" \
              '{path: $path, contents: $contents}'
          done | jq -sc '.')

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  expectedHeadOid: $oid,
                  message: { headline: "style: apply prettier formatting" },
                  fileChanges: { additions: $additions }
                }
              }
            }' > "$RUNNER_TEMP/commit.json"

          response=$(gh api graphql --input "$RUNNER_TEMP/commit.json")
          oid=$(printf '%s' "$response" | jq -r '.data.createCommitOnBranch.commit.oid // empty')
          if [ -z "$oid" ]; then
            echo "::error::createCommitOnBranch returned no commit"
            printf '%s' "$response" | jq .
            exit 1
          fi
          echo "Committed $oid"

      - name: Report unformatted files
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX != 'true'
        run: |
          {
            echo "### :x: Formatting check failed"
            echo
            echo "These files are not formatted:"
            echo
            echo '```'
            grep '^\[warn\] ' "$RUNNER_TEMP/prettier-output.txt" | grep -v 'Code style issues' | sed 's/^\[warn\] //' || true
            echo '```'
            echo
            echo 'Run `pnpm format` locally and push the result.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/data/members/{core,members}.ts and src/data/undrawAspectRatios.ts
      # are gitignored codegen that the app imports through the @/* alias. Only
      # `prebuild` generates them, so lint/typecheck have to do it themselves.
      - name: Generate codegen files
        run: pnpm codegen

      - name: Register ESLint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/eslint-stylish.json"

      - name: Lint
        # ESLint's stylish formatter prints absolute paths, which stop
        # annotations anchoring to the diff; strip the workspace prefix.
        run: |
          set -o pipefail
          pnpm lint | sed "s|^${GITHUB_WORKSPACE}/||"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate codegen files
        run: pnpm codegen

      - name: Register tsc problem matcher
        run: echo "::add-matcher::.github/problem-matchers/tsc.json"

      - name: Typecheck
        run: pnpm typecheck
