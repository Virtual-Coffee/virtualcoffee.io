name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Empty skips mise.dev.toml (docs/adr/0020): CI installs and runs only what
  # mise.toml pins. `interleave` keeps a task's own output unprefixed, which
  # the problem matchers and the sed below rely on.
  MISE_ENV: ''
  MISE_TASK_OUTPUT: interleave

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced from a step-level `if:`, so the whole
      # "may we push a fix?" decision is resolved once, here.
      # Fork PRs get no secrets at all, so the client id is empty and they fall
      # through to check-only automatically.
      # Bot branches are excluded because Renovate stops rebasing a branch as
      # soon as a commit from another author lands on it.
      CAN_AUTOFIX:
        ${{ secrets.CI_APP_CLIENT_ID != '' && github.event.pull_request.head.repo.full_name
        == github.repository && !contains(fromJSON('["renovate[bot]",
        "dependabot[bot]"]'), github.actor) }}
    steps:
      - name: Generate app token
        id: app-token
        if: env.CAN_AUTOFIX == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # `app-id` is deprecated in favour of `client-id`.
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          # The fix is committed through the API, so git itself never pushes.
          persist-credentials: false

      # Node (.nvmrc) and pnpm as pinned in mise.toml. The action
      # installs with --locked because mise.lock is committed.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        id: check
        run: |
          # Written outside the workspace: anything left in it would be swept
          # up by the auto-commit below.
          if mise run -q format --check > "$RUNNER_TEMP/prettier-output.txt" 2>&1; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$RUNNER_TEMP/prettier-output.txt"

      - name: Apply formatting
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX == 'true'
        run: mise run -q format

      # Committed through the GraphQL API rather than the git CLI, because
      # GitHub signs API-created commits: they show as Verified and are
      # attributed to the app instead of inheriting the last human committer.
      # expectedHeadOid also makes a concurrent push fail cleanly rather than
      # racing. Untrusted values (the branch name) go through env, never
      # interpolated into the shell.
      - name: Commit formatting
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Prettier only ever rewrites files that already exist, so additions
          # cover every change it can make: no deletions, no binaries.
          additions=$(git diff --name-only -z | while IFS= read -r -d '' f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 -- "$f")" \
              '{path: $path, contents: $contents}'
          done | jq -sc '.')

          jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg oid "$(git rev-parse HEAD)" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  expectedHeadOid: $oid,
                  message: { headline: "style: apply prettier formatting" },
                  fileChanges: { additions: $additions }
                }
              }
            }' > "$RUNNER_TEMP/commit.json"

          response=$(gh api graphql --input "$RUNNER_TEMP/commit.json")
          oid=$(printf '%s' "$response" | jq -r '.data.createCommitOnBranch.commit.oid // empty')
          if [ -z "$oid" ]; then
            echo "::error::createCommitOnBranch returned no commit"
            printf '%s' "$response" | jq .
            exit 1
          fi
          echo "Committed $oid"

      - name: Report unformatted files
        if: steps.check.outputs.needs_fix == 'true' && env.CAN_AUTOFIX != 'true'
        run: |
          {
            echo "### :x: Formatting check failed"
            echo
            echo "These files are not formatted:"
            echo
            echo '```'
            grep '^\[warn\] ' "$RUNNER_TEMP/prettier-output.txt" | grep -v 'Code style issues' | sed 's/^\[warn\] //' || true
            echo '```'
            echo
            echo 'Run `mise run format` locally and push the result.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.nvmrc) and pnpm as pinned in mise.toml. The action
      # installs with --locked because mise.lock is committed.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Register ESLint problem matcher
        run: echo "::add-matcher::.github/problem-matchers/eslint-stylish.json"

      - name: Lint
        # The task depends on codegen: the gitignored barrels the app imports
        # through the @/* alias have to exist first.
        # ESLint's stylish formatter prints absolute paths, which stop
        # annotations anchoring to the diff; strip the workspace prefix.
        run: |
          set -o pipefail
          mise run -q lint | sed "s|^${GITHUB_WORKSPACE}/||"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.nvmrc) and pnpm as pinned in mise.toml. The action
      # installs with --locked because mise.lock is committed.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Register tsc problem matcher
        run: echo "::add-matcher::.github/problem-matchers/tsc.json"

      # Depends on codegen, like every task below.
      - name: Typecheck
        run: mise run -q typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the coverage comment. Fork PRs never get it — see below.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.nvmrc) and pnpm as pinned in mise.toml. The action
      # installs with --locked because mise.lock is committed.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest switches to its github-actions reporter on its own here, so
      # failures annotate the diff without a problem matcher.
      - name: Test
        run: mise run -q test --coverage

      # Coverage totals in the job summary, plus a comment on the PR listing
      # the changed files' coverage. A fork PR's token can't write a comment,
      # so those get the summary only rather than a failing step. Runs after
      # a red test too — Vitest still writes the report, and that is when it
      # is most useful.
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          comment-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'pr' || 'none' }}

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node (.nvmrc) and pnpm as pinned in mise.toml. The action
      # installs with --locked because mise.lock is committed.
      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The github-actions reporter emits workflow commands, so findings land
      # as inline annotations without a problem matcher.
      - name: Knip
        run: mise run -q knip -- --reporter github-actions
